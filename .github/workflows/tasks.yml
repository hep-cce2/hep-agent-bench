name: tasks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: harbor lint
        # shared-verifier: both tasks grade in the agent's container on purpose (see each README)
        run: uvx --from harbor==0.25.0 harbor lint --ignore shared-verifier $(dirname $(find tasks -name task.toml))
      - name: solution/ copies of grader code match tests/ (rubric task-format.md, "solution/")
        run: |
          status=0
          for s in $(find tasks -path '*/solution/*' -type f ! -name solve.sh); do
            t=${s/\/solution\//\/tests\/}
            [ -f "$t" ] || continue
            cmp "$s" "$t" || { echo "::error file=$s::differs from $t"; status=1; }
          done
          exit $status
