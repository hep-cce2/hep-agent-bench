schema_version = "1.4"
artifacts = [{ source = "/workspace" }]

[task]
name = "hep-agent-bench/analysis-qa-1"
version = "0.1.0"
description = "Write a uv-runnable script that fetches ATLAS Open Data PHYSLITE through ServiceX and plots ETmiss (IRIS-HEP LLM question q1)."
keywords = ["hep", "analysis", "servicex", "func-adl", "atlas-open-data"]
[[task.authors]]
name = "Gordon Watts"
[[task.authors]]
name = "Xiangyang Ju"

[metadata]
upstream_repository = "https://github.com/gordonwatts/iris-hep-llm-performance"
upstream_commit = "edb61b9f524ab62c1be1ae7d09b262e95658a4f2"
upstream_question = "iris-hep-llm-questions.yaml#q1"
upstream_license = "BSD-3-Clause (see LICENSE-iris-hep-llm-performance)"
skills_repository = "https://github.com/iris-hep/marketplace"
skills_commit = "288a2fd6859bb69975d9f8ea86da135a0857c892"
# hep-agent-bench-spec fields (task-format.md)
hep_agent_bench_spec = "0.1"
# Not in spec v0.1, which only defines log-gain-vs-expert: a question-answer task has no gain.
score = "pass-fail"
gain = "none"
gate = "script.py re-run by the grader prints METRIC avg_entries_per_event=1.0 and mean=16.451025, each within 2% (relative)"
hardware = "CPU; network access to a ServiceX endpoint"
canary = "7053dfb6-bb61-4599-8e65-510d4d55a0bb"

[verifier]
# Re-runs the agent's script.py (ServiceX transform + plot) and checks its METRIC line.
timeout_sec = 2400.0
environment_mode = "shared"

[verifier.env]
SCRIPT_TIMEOUT_SEC = "1800"
HEPBENCH_TOOLS = "git+https://github.com/hep-cce2/hep-agent-bench-tools@v0.1.0"

[agent]
timeout_sec = 3600.0

[environment]
network_mode = "public"
build_timeout_sec = 900.0
os = "linux"
skills_dir = "/opt/iris-hep-marketplace/iris-hep/skills"
mcp_servers = []

[environment.env]

[solution.env]
